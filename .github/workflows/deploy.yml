name: Deploy

# Manual on-demand deploy: pulls the already-built, already-tested image for the
# chosen version (a release.yml-cut tag such as "v1.4.0", or "latest") from GHCR
# and restarts the arbitrage-scanner container on the VPS. Does not rebuild or
# retest - that happens once per release, in release.yml. See the reusable
# workflow (dimasdom/SpreadScanner/.github/workflows/deploy-service.yml) for the
# job itself and scripts/deploy-remote.sh for the VPS-side restart/rollback logic.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to deploy, e.g. "v1.4.0" (see Releases) or "latest"'
        required: true
        type: string
      dry_run:
        description: "Resolve inputs but skip the VPS deploy step"
        type: boolean
        default: false

jobs:
  deploy:
    uses: dimasdom/SpreadScanner/.github/workflows/deploy-service.yml@be8acb9c9928400f197ba8a5d64535410458b916 # master
    with:
      version: ${{ inputs.version }}
      deploy_services: "arbitrage-scanner"
      image_tag_vars: '{"arbitrage-scanner":"ARBITRAGE_SCANNER_IMAGE_TAG"}'
      dry_run: ${{ inputs.dry_run }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
