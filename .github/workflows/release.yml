name: Release

# Runs only on push to main. release-please parses conventional commits since the
# last tag and either opens/updates a Release PR (CHANGELOG.md + version bump) or,
# once that PR is merged, cuts the vX.Y.Z tag + GitHub Release for this merge
# commit. When a release is actually cut, build-and-push runs in the same job
# graph (not a separate `release: published`-triggered workflow) because a
# GITHUB_TOKEN-authored tag/release does not itself trigger new workflow runs -
# chaining it as a downstream job sidesteps that entirely. See
# dimasdom/SpreadScanner/.github/workflows/release-service.yml for what that job
# does, and that repo's deploy.yml for how a cut version actually gets deployed.
#
# Uses secrets.RELEASE_PLEASE_TOKEN (a PAT), not the default GITHUB_TOKEN, for both
# the release-please-action call and the auto-merge step below: the same loop-
# prevention rule above also blocks a GITHUB_TOKEN-authored PR from triggering
# ci.yml and blocks a GITHUB_TOKEN-authored merge from triggering this workflow
# again (which is what actually cuts the tag) - a PAT-authored PR/merge doesn't
# have that restriction, so both the CI gate and the auto-tag chain work.

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main

      # branch protection on main requires the ci.yml `build-and-test` check, so
      # this waits for that to go green on the release PR before merging it.
      - name: Auto-merge the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$RELEASE_PR_JSON" | jq -r '.number')
          gh pr merge --auto --squash --repo "${{ github.repository }}" "$PR_NUMBER"

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: dimasdom/SpreadScanner/.github/workflows/release-service.yml@be8acb9c9928400f197ba8a5d64535410458b916 # master
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      self_checkout_path: ArbitrageScanner
      solution_file: ArbitrageScanner.sln
      unit_test_project: ArbitrageScanner.Tests/ArbitrageScanner.Tests.csproj
      integration_test_project: ArbitrageScanner.IntegrationTests/ArbitrageScanner.IntegrationTests.csproj
      sibling_repos: "[]"
      images: >-
        [{"name":"arbitrage-scanner","dockerfile":"ArbitrageScanner/ArbitrageScanner.Worker/Dockerfile","context":"ArbitrageScanner","needs_root_checkout":false,"build_args":""}]
